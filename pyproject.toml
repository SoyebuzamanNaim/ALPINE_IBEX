[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-x"
version = "0.2.0"
description = "FLARE-X Evidence Atlas: Explainable AI Research Copilot for Spacecraft Fire Safety"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alpine Ibex Team", email = "flare-x@spaceapps.org" }
]
keywords = [
    "nasa-space-apps",
    "microgravity-combustion",
    "flame-spread",
    "spacecraft-fire-safety",
    "explainable-ai",
    "evidence-retrieval"
]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "pyarrow==26.0.0",
    "rank-bm25==0.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
