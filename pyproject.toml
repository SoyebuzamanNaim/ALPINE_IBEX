[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-x"
version = "0.2.0"
description = "FLARE-X Evidence Atlas: Explainable AI Research Copilot for Spacecraft Fire Safety"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alpine Ibex Team", email = "flare-x@spaceapps.org" }
]
keywords = [
    "nasa-space-apps",
    "microgravity-combustion",
    "flame-spread",
    "spacecraft-fire-safety",
    "explainable-ai",
    "evidence-retrieval"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
