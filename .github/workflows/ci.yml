name: Python and frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify checked-in model artifacts
        run: python scripts/verify_artifacts.py
      - name: Run Python regression suite
        run: pytest -q
      - name: Check Python imports and JavaScript syntax
        run: |
          python -m compileall -q src scripts
          node --check app/app.js
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: '22'
          cache: npm
      - name: Run live Playwright integration
        if: matrix.python-version == '3.12'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:frontend
      - name: Verify submission acceptance check against local FastAPI
        if: matrix.python-version == '3.12'
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8010 > /tmp/flare-demo-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8010/health > /dev/null
          FLARE_DEMO_URL=http://127.0.0.1:8010/ npm run test:demo
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: frontend-playwright
          path: |
            /tmp/flare-playwright/
            /tmp/flare-demo/
