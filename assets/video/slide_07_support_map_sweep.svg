<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0c162e"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="35%" stop-color="#ffb300"/>
      <stop offset="70%" stop-color="#52c41a"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="crimsonAlertGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Mandatory Watermark -->
  <rect x="1560" y="30" width="240" height="32" rx="4" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.4"/>
  <text x="1680" y="52" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00e5ff" text-anchor="middle">
    [ PROPOSED INTERACTION ]
  </text>

  <!-- Top Telemetry Header -->
  <text x="120" y="60" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00e5ff" letter-spacing="4">
    // FLAGSHIP INTERACTION · EXPERIMENTAL SUPPORT MAP [2:35–3:30]
  </text>
  <text x="120" y="100" font-family="'Orbitron', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    2D EXPERIMENTAL SUPPORT MAP &amp; COUNTERFACTUAL SWEEP
  </text>

  <!-- Left: 2D Coordinate Space (Support Map) -->
  <g transform="translate(120, 150)">
    <rect width="840" height="640" rx="12" fill="#070c18" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Title & Legend -->
    <text x="30" y="40" font-family="'Orbitron', sans-serif" font-size="16" font-weight="bold" fill="#00e5ff">
      COORDINATE SPACE: O₂ MOLE FRACTION vs FORCED AIRFLOW
    </text>
    <text x="30" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#8899b8">
      Material: PMMA Cylinder · Pressure: 101.3 kPa · NASA Experiments: 145 Tests
    </text>

    <!-- Legend Icons -->
    <circle cx="620" cy="45" r="6" fill="#00e5ff"/>
    <text x="635" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a0aec0">NASA Test (●)</text>
    <polygon points="730,40 733,48 741,48 735,53 737,61 730,56 723,61 725,53 719,48 727,48" fill="#ff4d4f"/>
    <text x="750" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff4d4f">Scenario (★)</text>

    <!-- Coordinate Box & Grid -->
    <g transform="translate(80, 100)">
      <!-- Axis Background -->
      <rect width="700" height="480" fill="#04070e" stroke="#1e293b"/>
      
      <!-- Grid Lines -->
      <line x1="0" y1="120" x2="700" y2="120" stroke="#1e293b" stroke-dasharray="4 4"/>
      <line x1="0" y1="240" x2="700" y2="240" stroke="#1e293b" stroke-dasharray="4 4"/>
      <line x1="0" y1="360" x2="700" y2="360" stroke="#1e293b" stroke-dasharray="4 4"/>
      <line x1="175" y1="0" x2="175" y2="480" stroke="#1e293b" stroke-dasharray="4 4"/>
      <line x1="350" y1="0" x2="350" y2="480" stroke="#1e293b" stroke-dasharray="4 4"/>
      <line x1="525" y1="0" x2="525" y2="480" stroke="#1e293b" stroke-dasharray="4 4"/>

      <!-- Safe Flight Data Envelope (Convex Hull) -->
      <polygon points="120,400 240,430 480,380 640,280 600,100 380,80 200,180" 
               fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-dasharray="6 4" stroke-width="2"/>
      <text x="380" y="240" font-family="'Orbitron', sans-serif" font-size="14" fill="#00e5ff" fill-opacity="0.4" text-anchor="middle">
        NASA TESTED ENVELOPE
      </text>

      <!-- Extinction Quenching Boundary -->
      <path d="M 0,320 Q 200,340 400,260 T 700,160" fill="none" stroke="#ffb300" stroke-width="2" stroke-dasharray="8 4"/>
      <text x="560" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300">
        Extinction Boundary
      </text>

      <!-- NASA Scatter Points (Cyan Dots) -->
      <circle cx="220" cy="380" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="260" cy="360" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="290" cy="400" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="340" cy="320" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="380" cy="300" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="420" cy="270" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="460" cy="220" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="500" cy="200" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="530" cy="180" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="580" cy="140" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="400" cy="160" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="310" cy="220" r="5" fill="#00e5ff" opacity="0.8"/>
      <circle cx="250" cy="240" r="5" fill="#00e5ff" opacity="0.8"/>

      <!-- Highlighted Nearest NASA Points -->
      <circle cx="220" cy="380" r="9" fill="none" stroke="#52c41a" stroke-width="2"/>
      <text x="235" y="385" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52c41a">Test 31 (18.4% O₂)</text>

      <circle cx="260" cy="360" r="9" fill="none" stroke="#52c41a" stroke-width="2"/>
      <text x="275" y="355" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52c41a">Test 42 (19.0% O₂)</text>

      <!-- Active User Scenario Trajectory -->
      <line x1="450" y1="360" x2="60" y2="360" stroke="#ff4d4f" stroke-width="2" stroke-dasharray="6 4"/>
      
      <!-- Current State 4 Position: 15.0% O2 (Outside!) -->
      <polygon points="60,350 64,360 74,360 66,366 69,376 60,370 51,376 54,366 46,360 56,360" 
               fill="#ff4d4f" filter="url(#crimsonAlertGlow)"/>
      <circle cx="60" cy="360" r="22" fill="none" stroke="#ff4d4f" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="60" y="405" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ff4d4f" text-anchor="middle">
        Scenario (15.0% O₂)
      </text>

      <!-- Y-Axis Labels (Flow cm/s) -->
      <text x="-15" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="end">35</text>
      <text x="-15" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="end">25</text>
      <text x="-15" y="245" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="end">15</text>
      <text x="-15" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="end">5</text>
      <text x="-15" y="475" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="end">0 cm/s</text>

      <!-- X-Axis Labels (O2 %) -->
      <text x="10" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8">15%</text>
      <text x="175" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8">18%</text>
      <text x="350" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8">21%</text>
      <text x="525" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8">25%</text>
      <text x="680" y="505" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8">30% O₂</text>
    </g>
  </g>

  <!-- Right: 4-State Progression & Active Refusal Card -->
  <g transform="translate(1000, 150)">
    <!-- Oxygen Slider Bar -->
    <rect width="800" height="90" rx="10" fill="#0b1224" stroke="#00e5ff" stroke-opacity="0.3"/>
    <text x="30" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00e5ff">
      REAL-TIME COUNTERFACTUAL PARAMETER SWEEP
    </text>
    <text x="30" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#8899b8">
      Sweeping O₂: 21% ──► 20% ──► 19% ──► 18% ──► 17% ──► 15% (Extinction Study)
    </text>
    
    <!-- Visual Slider Track -->
    <rect x="350" y="45" width="410" height="12" rx="6" fill="#1e293b"/>
    <rect x="350" y="45" width="60" height="12" rx="6" fill="#ff4d4f"/>
    <circle cx="410" cy="51" r="12" fill="#ffffff" stroke="#ff4d4f" stroke-width="3"/>
    <text x="410" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ff4d4f" text-anchor="middle">15.0%</text>

    <!-- 4 Transition States -->
    <g transform="translate(0, 115)">
      <!-- State 1 -->
      <rect x="0" y="0" width="190" height="100" rx="8" fill="#111c38" stroke="#52c41a" stroke-opacity="0.3"/>
      <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">STATE 1 (21% O₂)</text>
      <text x="15" y="55" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓ INSIDE</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#8899b8">High NASA Support</text>

      <!-- State 2 -->
      <rect x="205" y="0" width="190" height="100" rx="8" fill="#111c38" stroke="#ffb300" stroke-opacity="0.3"/>
      <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300">STATE 2 (19% O₂)</text>
      <text x="15" y="55" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">△ BOUNDARY</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#8899b8">Flammability Limit</text>

      <!-- State 3 -->
      <rect x="410" y="0" width="190" height="100" rx="8" fill="#111c38" stroke="#ff7700" stroke-opacity="0.3"/>
      <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff7700">STATE 3 (17% O₂)</text>
      <text x="15" y="55" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">! PARTIAL</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#8899b8">Sparsely Tested</text>

      <!-- State 4: Current Active Refusal -->
      <rect x="615" y="0" width="185" height="100" rx="8" fill="#220a12" stroke="#ff4d4f" stroke-width="2"/>
      <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d4f" font-weight="bold">STATE 4 (15% O₂)</text>
      <text x="15" y="55" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#ff4d4f">× OUTSIDE</text>
      <text x="15" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#ff4d4f">Refusal Active</text>
    </g>

    <!-- Climax Full Card: THE PREDICTION IS WITHHELD -->
    <g transform="translate(0, 240)">
      <rect width="800" height="280" rx="12" fill="#18070b" stroke="#ff4d4f" stroke-width="2.5" filter="url(#crimsonAlertGlow)"/>
      
      <circle cx="60" cy="65" r="28" fill="#ff4d4f" fill-opacity="0.2"/>
      <text x="60" y="75" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#ff4d4f" text-anchor="middle">!</text>

      <text x="110" y="55" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#ff4d4f" letter-spacing="2">
        EXPERIMENTAL ENVELOPE GUARD TRIGGERED
      </text>
      <text x="110" y="88" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">
        OUTSIDE NASA-SUPPORTED MODEL DOMAIN
      </text>

      <line x1="30" y1="120" x2="770" y2="120" stroke="#ff4d4f" stroke-opacity="0.3"/>

      <!-- Big Highlighted Withheld Box -->
      <rect x="30" y="140" width="740" height="60" rx="6" fill="#060913" stroke="#ff4d4f" stroke-opacity="0.6"/>
      <text x="370" y="178" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#ff4d4f" text-anchor="middle" letter-spacing="2">
        RELIABLE PREDICTION WITHHELD.
      </text>

      <text x="30" y="230" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
        NASA BASS-II has no validated PMMA flight data at 15.0% O₂. FLARE-X refuses unvalidated extrapolation.
      </text>
      <text x="30" y="255" font-family="'JetBrains Mono', monospace" font-size="12" fill="#52c41a">
        Nearest verified NASA boundary: BASS-II Test 31 (18.4% O₂) &amp; Test 42 (19.0% O₂) remain displayed.
      </text>
    </g>
  </g>

  <!-- Bottom Hero Line -->
  <g transform="translate(960, 840)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ABSENCE OF EVIDENCE IS NOT EVIDENCE OF SAFETY.
    </text>
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="15" fill="#8899b8" text-anchor="middle">
      By refusing unverified guesses, FLARE-X preserves scientific integrity for mission designers and researchers.
    </text>
  </g>

  <!-- Lower Border Safe Zone Indicator -->
  <rect x="120" y="1020" width="1680" height="2" fill="#00e5ff" opacity="0.3"/>
  <text x="960" y="1048" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="middle">
    INTERACTIVE SUPPORT MAP · ACTIVE ABSTENTION DEMONSTRATION · NASA SPACE APPS 2026
  </text>
</svg>
