        <text x="45" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0f172a">BASS-II Test 31</text>
        <text x="195" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#475569">PMMA Rod · 15.2% O₂ · 14.8 cm/s</text>
        <text x="490" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">Outcome: Quenched (42s)</text>
        <text x="680" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1d4ed8">Gower: 0.94</text>
