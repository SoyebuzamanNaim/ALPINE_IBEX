        <text x="15" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#1d4ed8">#2</text>
        <text x="45" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0f172a">BASS-II Test 42</text>
        <text x="195" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#475569">PMMA Rod · 16.5% O₂ · 15.0 cm/s</text>
        <text x="490" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">Outcome: Quenched (58s)</text>
        <text x="680" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1d4ed8">Gower: 0.89</text>
      </g>

      <g transform="translate(0, 149)">
        <rect width="740" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="15" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#1d4ed8">#3</text>
        <text x="45" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0f172a">BASS-II Test 56</text>
        <text x="195" y="30" font-family="'Inter', sans-serif" font-size="12" fill="#475569">PMMA Rod · 18.0% O₂ · 15.2 cm/s</text>
        <text x="490" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#d97706">Outcome: Sustained (120s)</text>
