      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">BASS-II Test 31 (O₂: 19.2%, Flow: 16.0 cm/s)</text>
      <text x="20" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#8899b8">Outcome: Flame extinction at 18.4% O₂ threshold</text>
    </g>

    <g transform="translate(300, 80)">
      <rect width="520" height="110" rx="6" fill="#111c38" stroke="#ff4d4f" stroke-opacity="0.4"/>
      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#ff4d4f">ENVELOPE GOVERNANCE</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Refuses extrapolation if O₂ &lt; 16.0%</text>
      <text x="20" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#8899b8">Outputs nearest NASA observations instead of hallucinating</text>
    </g>
