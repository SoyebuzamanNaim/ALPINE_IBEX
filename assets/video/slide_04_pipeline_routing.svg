      <circle cx="45" cy="45" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="45" y="53" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#1d4ed8" text-anchor="middle">03</text>
