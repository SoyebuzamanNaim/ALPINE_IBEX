      <text x="25" y="300" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#0f172a">#1 BASS-II Test 31 (98%)</text>
      <text x="25" y="324" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#0f172a">#2 BASS-II Test 42 (95%)</text>
