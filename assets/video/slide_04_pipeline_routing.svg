      <text x="25" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1d4ed8">User Prompt:</text>
      <text x="25" y="298" font-family="'Inter', sans-serif" font-size="11" fill="#334155">"PMMA rod in ISS duct,</text>
      <text x="25" y="318" font-family="'Inter', sans-serif" font-size="11" fill="#334155">18% O₂, 15 cm/s airflow."</text>
      <rect x="25" y="415" width="215" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="35" y="435" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">✓ Parsed 5 variables</text>
