      <text x="20" y="136" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">Direct traceability to NASA</text>
      <text x="20" y="156" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">PSI &amp; NTRS primary DOIs.</text>

      <rect x="15" y="240" width="235" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="25" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1d4ed8">Audit Lineage:</text>
      <text x="25" y="300" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a">Claim ──► BASS Test 31</text>
      <text x="25" y="324" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f172a">──► NASA/TP-2016-219216</text>
      <text x="25" y="348" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0284c7">──► doi:10.2514/6.2016</text>
      <rect x="25" y="415" width="215" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="35" y="435" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">✓ 100% Audit Lineage</text>
