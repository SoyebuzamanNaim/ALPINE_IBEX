<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgLabGrad)"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>

  <!-- Mandatory Concept Watermark -->
  <rect x="1560" y="36" width="240" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1680" y="58" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">
    [ ILLUSTRATIVE CONCEPT UI ]
  </text>

  <!-- Top Telemetry Header -->
