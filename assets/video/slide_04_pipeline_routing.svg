      <text x="25" y="298" font-family="'Inter', sans-serif" font-size="11" fill="#7f1d1d">Convex hull &amp; Gower</text>
      <text x="25" y="318" font-family="'Inter', sans-serif" font-size="11" fill="#7f1d1d">support threshold check.</text>
      <text x="25" y="348" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#dc2626">"PREDICTION WITHHELD"</text>
      <text x="25" y="372" font-family="'Inter', sans-serif" font-size="11" fill="#7f1d1d">Prevents hallucination.</text>
      <rect x="25" y="415" width="215" height="30" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <text x="35" y="435" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#dc2626">🛡️ Safe Refusal Active</text>
