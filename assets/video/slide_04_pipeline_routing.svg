      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#00e5ff">SCENARIO IDENTIFICATION</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">Material: Polymethyl Methacrylate (PMMA)</text>
      <text x="20" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#8899b8">Geometry: 1.27 cm Cylinder | Ambient: 1.0 atm</text>
