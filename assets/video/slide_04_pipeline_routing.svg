      <text x="20" y="112" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Family Classifier</text>
      <text x="20" y="136" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">Assigns scenario to exact</text>
      <text x="20" y="156" font-family="'Inter', sans-serif" font-size="11.5" fill="#64748b">combustion physics regime.</text>

      <rect x="15" y="240" width="235" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="25" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1d4ed8">Family Routing:</text>
      <text x="25" y="300" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0284c7">SOLID POLYMERS</text>
      <text x="25" y="328" font-family="'Inter', sans-serif" font-size="12" fill="#475569">Target: BASS-II archive</text>
      <text x="25" y="352" font-family="'Inter', sans-serif" font-size="12" fill="#475569">Regime: Opposed Flow</text>
      <rect x="25" y="415" width="215" height="30" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="35" y="435" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">✓ Family Locked: SOLID</text>
