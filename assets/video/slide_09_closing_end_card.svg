<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#eff6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgLabGrad)"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Orbital Rings Behind Logo -->
  <g transform="translate(960, 310)">
    <circle r="230" fill="url(#emblemGlow)"/>
    <ellipse rx="220" ry="75" fill="none" stroke="#1d4ed8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-25)"/>
    <ellipse rx="220" ry="75" fill="none" stroke="#0284c7" stroke-opacity="0.2" stroke-width="1.5" transform="rotate(35)"/>
    <circle r="160" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle r="110" fill="none" stroke="#1d4ed8" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Central Aerospace Blue Flame Core -->
    <path d="M 0,-56 C 24,-24 40,5 30,32 C 22,54 -22,54 -30,32 C -40,5 -24,-24 0,-56 Z" 
          fill="#1d4ed8"/>
    <path d="M 0,-32 C 14,-14 22,4 18,20 C 14,34 -14,34 -18,20 C -22,4 -14,-14 0,-32 Z" 
          fill="#38bdf8"/>
    <circle cx="0" cy="12" r="8" fill="#ffffff"/>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(960, 480)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="74" font-weight="900" fill="#0f172a" letter-spacing="8" text-anchor="middle">
      FLARE-X
    </text>
    
    <text x="0" y="58" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#1d4ed8" letter-spacing="3" text-anchor="middle">
      EVIDENCE-BOUNDED AI FOR MICROGRAVITY FIRE SCIENCE
    </text>

    <!-- Motto Pill -->
    <g transform="translate(0, 88)">
      <rect x="-330" y="0" width="660" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="0" y="29" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#0f172a" letter-spacing="1" text-anchor="middle">
        "Find the evidence. Know its limits."
      </text>
    </g>
  </g>

  <!-- Team & Submission Credits Card -->
  <g transform="translate(960, 680)">
    <rect x="-650" y="0" width="1300" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" letter-spacing="2" text-anchor="middle">
      DEVELOPED BY TEAM FLARE-X · BANGLADESH NOMINEE
    </text>

    <!-- Team Members & Updated Roles -->
    <g transform="translate(0, 68)" font-family="'Inter', sans-serif" font-size="13.5" text-anchor="middle">
      <text x="0" y="0" fill="#0f172a" font-weight="700">
        <tspan fill="#1d4ed8">Naim</tspan> (Full Stack Dev)  •  
        <tspan fill="#1d4ed8">Mahim</tspan> (AI ML Engineer)  •  
        <tspan fill="#1d4ed8">Masum</tspan> (Researcher)  •  
        <tspan fill="#1d4ed8">Muntaha</tspan> (UI UX Designer)  •  
        <tspan fill="#1d4ed8">Hamza</tspan> (Backend Dev &amp; Researcher)  •  
        <tspan fill="#1d4ed8">Nahid</tspan> (Video Editor)
      </text>
      <text x="0" y="28" fill="#64748b" font-size="12.5">
        Soyebuzaman Naim  •  Saber Hossain Mahim  •  Abdullah Al Masum  •  Mahzabin Muntaha  •  Hamza  •  Nahid
      </text>
    </g>

    <line x1="-350" y1="115" x2="350" y2="115" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="0" y="136" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">
      NASA INTERNATIONAL SPACE APPS CHALLENGE 2026 · FLAME IN FREEFALL
    </text>
  </g>

  <!-- Bottom Legal Disclaimer -->
  <g transform="translate(960, 875)">
    <rect x="-650" y="0" width="1300" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">
      RESEARCH DECISION-SUPPORT PROTOTYPE · NOT FOR OPERATIONAL LIFE-SAFETY OR EMERGENCY FLIGHT CONTROL
    </text>
  </g>
</svg>
