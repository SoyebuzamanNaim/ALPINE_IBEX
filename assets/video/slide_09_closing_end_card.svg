<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="45%" stop-color="#060b18"/>
      <stop offset="85%" stop-color="#03050c"/>
      <stop offset="100%" stop-color="#010205"/>
    </radialGradient>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0055ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Orbital Rings Behind Logo -->
  <g transform="translate(960, 400)">
    <circle r="260" fill="url(#emblemGlow)"/>
    <ellipse rx="240" ry="80" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1.5" transform="rotate(-25)"/>
    <ellipse rx="240" ry="80" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1.5" transform="rotate(35)"/>
    <circle r="180" fill="none" stroke="#64748b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 4"/>
    <circle r="120" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Central Fire Symbol Core -->
    <path d="M 0,-60 C 25,-25 45,5 35,35 C 25,60 -25,60 -35,35 C -45,5 -25,-25 0,-60 Z" 
          fill="#00e5ff" filter="url(#logoGlow)"/>
    <path d="M 0,-35 C 15,-15 25,5 20,22 C 15,38 -15,38 -20,22 C -25,5 -15,-15 0,-35 Z" 
          fill="#ffffff"/>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(960, 570)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">
      FLARE-X
    </text>
    
    <text x="0" y="65" font-family="'Orbitron', sans-serif" font-size="24" font-weight="bold" fill="#00e5ff" letter-spacing="3" text-anchor="middle">
      EVIDENCE-BOUNDED AI FOR MICROGRAVITY FIRE SCIENCE
    </text>

    <!-- Motto -->
    <rect x="-350" y="95" width="700" height="48" rx="24" fill="#091226" stroke="#00e5ff" stroke-opacity="0.3"/>
    <text x="0" y="127" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      "Find the evidence. Know its limits."
    </text>
  </g>

  <!-- Team & Submission Credits Grid -->
  <g transform="translate(960, 780)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8899b8" letter-spacing="2" text-anchor="middle">
      DEVELOPED BY TEAM FLARE-X · BANGLADESH
    </text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="15" fill="#cbd5e1" font-weight="500" text-anchor="middle">
      Saber Hossain Mahim  •  Ismail Hossen  •  Mahzabin Muntaha  •  Abdullah Al Masum  •  Nahid  •  Soyebuzaman Naim
    </text>

    <line x1="-300" y1="50" x2="300" y2="50" stroke="#00e5ff" stroke-opacity="0.2"/>

    <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="13" fill="#00e5ff" text-anchor="middle">
      NASA INTERNATIONAL SPACE APPS CHALLENGE 2026 · CHALLENGE: FLAME IN FREEFALL
    </text>
  </g>

  <!-- Bottom Legal Disclaimer -->
  <g transform="translate(960, 930)">
    <rect x="-600" y="0" width="1200" height="50" rx="6" fill="#050914" stroke="#ff4d4f" stroke-opacity="0.25"/>
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      RESEARCH DECISION-SUPPORT PROTOTYPE · NOT FOR OPERATIONAL LIFE-SAFETY OR EMERGENCY FLIGHT CONTROL
    </text>
  </g>

  <!-- Lower Border Safe Zone Indicator -->
  <rect x="120" y="1020" width="1680" height="2" fill="#00e5ff" opacity="0.3"/>
  <text x="960" y="1048" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="middle">
    SUBMISSION VIDEO 1 · TARGET RUNTIME 03:52 · OPEN SOURCE REPRODUCIBILITY UNDER APACHE 2.0
  </text>
</svg>
