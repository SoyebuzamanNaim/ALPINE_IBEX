<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="hatchLight" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="1.5"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgLabGrad)" rx="10"/>
  <rect width="898" height="498" x="1" y="1" fill="none" stroke="#cbd5e1" rx="10"/>

  <text x="450" y="38" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">
    2-D FLAMMABILITY BOUNDARY SLICE · PMMA AT 101.3 kPa
  </text>
  <text x="450" y="60" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    OVERLAID WITH HISTORICAL NASA BASS FLIGHT OBSERVATIONS
  </text>

  <!-- Plot Area -->
  <g transform="translate(0, 5)">
    <!-- Refused hatched region (< 15.0% O₂) -->
    <rect x="100" y="80" width="80" height="340" fill="url(#hatchLight)" stroke="#fca5a5"/>
    <text x="140" y="250" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle" transform="rotate(-90 140 250)">
      REFUSED (EXTRAPOLATION)
    </text>

    <!-- Emerald region: Extinction / No Spread (15.0% to 17.5% O₂) -->
    <rect x="180" y="80" width="120" height="340" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="240" y="250" font-family="'Orbitron', sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">
      NO SPREAD / EXTINCTION
    </text>

    <!-- Amber strip: Marginal Spread (17.5% to 18.2% O₂) -->
    <rect x="300" y="80" width="60" height="340" fill="#fffbeb" stroke="#fde68a"/>
    <text x="330" y="250" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="800" fill="#d97706" text-anchor="middle" transform="rotate(-90 330 250)">
      MARGINAL SPREAD
    </text>

    <!-- Blue region: Sustained Flame (> 18.2% O₂) -->
    <rect x="360" y="80" width="440" height="340" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="580" y="250" font-family="'Orbitron', sans-serif" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      SUSTAINED FLAME PROPAGATION
    </text>

    <!-- Plot Frame -->
    <rect x="100" y="80" width="700" height="340" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- NASA BASS Observation Dots -->
    <g stroke="#ffffff" stroke-width="1">
      <!-- Sustained Burns -->
      <circle cx="480" cy="180" r="5" fill="#1d4ed8"/>
      <circle cx="540" cy="220" r="5" fill="#1d4ed8"/>
      <circle cx="620" cy="160" r="5" fill="#1d4ed8"/>
      <circle cx="690" cy="280" r="5" fill="#1d4ed8"/>
      <circle cx="420" cy="310" r="5" fill="#1d4ed8"/>
      <circle cx="510" cy="260" r="5" fill="#1d4ed8"/>
      <circle cx="580" cy="340" r="5" fill="#1d4ed8"/>
      <circle cx="660" cy="190" r="5" fill="#1d4ed8"/>
      <circle cx="730" cy="230" r="5" fill="#1d4ed8"/>

      <!-- Extinction Burns -->
      <circle cx="210" cy="210" r="5" fill="#059669"/>
      <circle cx="230" cy="290" r="5" fill="#059669"/>
      <circle cx="260" cy="170" r="5" fill="#059669"/>
      <circle cx="280" cy="330" r="5" fill="#059669"/>
      <circle cx="240" cy="240" r="5" fill="#059669"/>

      <!-- Marginal Burns -->
      <circle cx="320" cy="200" r="5" fill="#d97706"/>
      <circle cx="340" cy="270" r="5" fill="#d97706"/>
    </g>

    <!-- Axis Labels -->
    <text x="450" y="450" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
      Ambient Oxygen Concentration (% O₂) ──►
    </text>
    <text x="50" y="250" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 50 250)">
      Forced Velocity u (cm/s) ──►
    </text>
  </g>
</svg>
