<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="900" height="460" fill="url(#bgLabGrad)" rx="10"/>
  <rect width="898" height="458" x="1" y="1" fill="none" stroke="#cbd5e1" rx="10"/>

  <text x="450" y="38" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">
    FLAGSHIP DEMO: OXYGEN SWEEP &amp; EXTINCTION TRANSITION
  </text>
  <text x="450" y="60" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    PMMA AT 101.3 kPa · 5.0 cm/s VENTILATION · 21.0% DOWN TO 16.0% O₂
  </text>

  <!-- Plot Box -->
  <rect x="70" y="85" width="760" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Vertical Boundary Line at 17.5% -->
  <line x1="302" y1="85" x2="302" y2="330" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="312" y="112" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#d97706">
    PHYSICAL BOUNDARY: 17.5% O₂ (LOC)
  </text>

  <!-- Curve: P(Spread) in Crimson -->
  <path d="M 70,325 Q 220,320 280,280 T 320,180 T 420,105 L 830,95" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="660" y="115" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#dc2626">
    P(Sustained Flame)
  </text>

  <!-- Curve: P(Extinction) in Emerald -->
  <path d="M 70,95 Q 220,105 280,180 T 320,280 T 420,320 L 830,325" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="130" y="125" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#059669">
    P(Extinction Quench)
  </text>

  <!-- Step Boxes Below Plot -->
  <g transform="translate(70, 350)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="235" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#1d4ed8">STEP 1: 21.0% O₂</text>
    <text x="15" y="44" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">P(Spread) = 97.7%</text>
    <text x="15" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Stable vigorous combustion</text>

    <!-- Box 2 -->
    <rect x="262" y="0" width="235" height="85" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="277" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#d97706">STEP 2: 17.5% O₂</text>
    <text x="277" y="44" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#d97706">TRANSITION REGION</text>
    <text x="277" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Epistemic Caution Flag</text>

    <!-- Box 3 -->
    <rect x="525" y="0" width="235" height="85" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="540" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">STEP 3: 16.0% O₂</text>
    <text x="540" y="44" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#059669">P(Extinction) = 98.2%</text>
    <text x="540" y="64" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Self-extinguishes (Quenched)</text>
  </g>
</svg>
