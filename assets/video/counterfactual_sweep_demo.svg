<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" fill="url(#bgS)" rx="8"/>
  <rect width="898" height="458" x="1" y="1" fill="none" stroke="#00e5ff" stroke-opacity="0.2" rx="8"/>

  <text x="450" y="38" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
    KILLER DEMO: OXYGEN SWEEP & EXTINCTION TRANSITION
  </text>
  <text x="450" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff" text-anchor="middle">
    PMMA AT 101.3 kPa · 5.0 cm/s VENTILATION · 21.0% DOWN TO 16.0% O₂
  </text>

  <!-- Plot Box -->
  <rect x="80" y="90" width="740" height="240" fill="#02050b" stroke="rgba(255,255,255,0.1)"/>

  <!-- Vertical Boundary Line at 17.5% -->
  <!-- 16.0% = 80, 21.0% = 820. 17.5% = 80 + (1.5/5.0)*740 = 80 + 222 = 302 -->
  <line x1="302" y1="90" x2="302" y2="330" stroke="#ffb300" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="312" y="115" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffb300">
    PHYSICAL BOUNDARY: 17.5% O₂ (LOC)
  </text>

  <!-- Curve: P(Spread) in Crimson -->
  <path d="M 80,325 Q 220,320 280,280 T 320,180 T 420,105 L 820,95" fill="none" stroke="#ff3366" stroke-width="3"/>
  <text x="650" y="115" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ff3366">
    P(Sustained Spread)
  </text>

  <!-- Curve: P(No Spread) in Cyan -->
  <path d="M 80,95 Q 220,105 280,180 T 320,280 T 420,320 L 820,325" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <text x="140" y="125" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#00e5ff">
    P(Extinction)
  </text>

  <!-- Baseline Marker at 21.0% -->
  <line x1="820" y1="90" x2="820" y2="330" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="820" cy="95" r="5" fill="#ffffff"/>
  <text x="760" y="80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">
    BASELINE (21.0% O₂)
  </text>

  <!-- Safety Margin Arrow between 17.5% and 21.0% -->
  <line x1="302" y1="210" x2="820" y2="210" stroke="#2ed573" stroke-width="2"/>
  <polygon points="302,206 294,210 302,214" fill="#2ed573"/>
  <polygon points="820,206 828,210 820,214" fill="#2ed573"/>
  <rect x="500" y="195" width="160" height="28" fill="#111a30" stroke="#2ed573" rx="4"/>
  <text x="580" y="214" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" fill="#2ed573" text-anchor="middle">
    SAFETY MARGIN: +3.25%
  </text>

  <!-- Ticks X -->
  <text x="80" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">16.0%</text>
  <text x="228" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">17.0%</text>
  <text x="302" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300" text-anchor="middle">17.5%</text>
  <text x="376" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">18.0%</text>
  <text x="524" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">19.0%</text>
  <text x="672" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">20.0%</text>
  <text x="820" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899b8" text-anchor="middle">21.0%</text>

  <!-- Evidence Cards Below Axis -->
  <!-- Left Evidence Card (Extinction) -->
  <g transform="translate(80, 370)">
    <rect width="350" height="70" fill="#111a30" stroke="#00e5ff" rx="6"/>
    <text x="14" y="24" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" fill="#00e5ff">
      BELOW BOUNDARY CITATION
    </text>
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff">
      NTRS 20140011099 · 16.5% O₂ · PMMA
    </text>
    <text x="14" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#8899b8">
      Observed: Extinction / No spread under 4 cm/s flow
    </text>
  </g>

  <!-- Right Evidence Card (Spread) -->
  <g transform="translate(470, 370)">
    <rect width="350" height="70" fill="#111a30" stroke="#ff3366" rx="6"/>
    <text x="14" y="24" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" fill="#ff3366">
      ABOVE BOUNDARY CITATION
    </text>
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff">
      NTRS 20160010041 · 20.8% O₂ · PMMA
    </text>
    <text x="14" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#8899b8">
      Observed: Continuous flame propagation on ISS
    </text>
  </g>
</svg>
