<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="900" height="440" fill="url(#bgLabGrad)" rx="10"/>
  <rect width="898" height="438" x="1" y="1" fill="none" stroke="#cbd5e1" rx="10"/>

  <text x="450" y="38" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">
    ZERO-FABRICATION CITATION &amp; AUDITING FLOW
  </text>
  <text x="450" y="60" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    STRICT MATHEMATICAL GUARD: ONLY PERMITTED NUMBERS &amp; REPORT IDs REACH USERS
  </text>

  <!-- Step 1: Prediction Object -->
  <g transform="translate(50, 95)">
    <rect width="230" height="295" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <text x="115" y="26" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">
      1. PREDICTION OBJECT
    </text>
    <rect x="15" y="42" width="200" height="235" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="25" y="68" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#64748b">Authorized Numbers:</text>
    <text x="25" y="90" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">O₂: 21.0%</text>
    <text x="25" y="112" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">Pressure: 101.3 kPa</text>
    <text x="25" y="134" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">Flow: 5.0 cm/s</text>
    <text x="25" y="156" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0f172a">P(spread): 97.7%</text>
    <text x="25" y="178" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#1d4ed8">CV Acc: 79.31%</text>
    <text x="25" y="208" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#059669">Allowed Report IDs:</text>
    <text x="25" y="230" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">NTRS 20160010041</text>
    <text x="25" y="250" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">NTRS 20140011099</text>
  </g>

  <!-- Step 2: Explanation Composer -->
  <g transform="translate(335, 95)">
    <rect width="230" height="295" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#cardShadow)"/>
    <text x="115" y="26" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#0284c7" text-anchor="middle">
      2. LLM SYNTHESIS
    </text>
    <rect x="15" y="42" width="200" height="235" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="25" y="68" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#64748b">Draft Response:</text>
    <text x="25" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#334155" line-height="1.4">"At 21% O₂ and 5 cm/s flow, BASS-II data shows sustained flame with 97.7% likelihood [NTRS 20160010041]. Model accuracy is 79.31%."</text>
    
    <rect x="25" y="225" width="180" height="35" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="115" y="247" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Sends to Auditor</text>
  </g>

  <!-- Step 3: Strict Regex Auditor -->
  <g transform="translate(620, 95)">
    <rect width="230" height="295" fill="#ffffff" stroke="#059669" stroke-width="2" rx="8" filter="url(#cardShadow)"/>
    <text x="115" y="26" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#059669" text-anchor="middle">
      3. NUMERICAL AUDITOR
    </text>
    <rect x="15" y="42" width="200" height="235" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="6"/>
    <text x="25" y="68" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#059669">Audit Scan Rules:</text>
    <text x="25" y="94" font-family="'Inter', sans-serif" font-size="11" fill="#14532d">• Extracts every regex float</text>
    <text x="25" y="116" font-family="'Inter', sans-serif" font-size="11" fill="#14532d">• Checks against pool</text>
    <text x="25" y="138" font-family="'Inter', sans-serif" font-size="11" fill="#14532d">• Validates report IDs</text>

    <rect x="25" y="165" width="180" height="95" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="190" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#059669">✓ AUDIT VERIFIED</text>
    <text x="35" y="210" font-family="'Inter', sans-serif" font-size="10.5" fill="#14532d">Zero fabricated metrics</text>
    <text x="35" y="230" font-family="'Inter', sans-serif" font-size="10.5" fill="#14532d">100% NTRS citation match</text>
    <text x="35" y="248" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#059669">Approved for User</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="280" y1="240" x2="335" y2="240" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="565" y1="240" x2="620" y2="240" stroke="#0284c7" stroke-width="2"/>
</svg>
