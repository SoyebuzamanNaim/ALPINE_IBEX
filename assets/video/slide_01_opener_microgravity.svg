<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f1932"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#0055ff"/>
      <stop offset="90%" stop-color="#111144" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerSoot" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ff7700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#00e5ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Telemetry Header -->
  <text x="120" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="#00e5ff" letter-spacing="4" opacity="0.8">
    // NASA SPACE APPS CHALLENGE 2026 · CHALLENGE #08: FLAME IN FREEFALL
  </text>
  <text x="1800" y="100" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="#64748b" letter-spacing="2" text-anchor="end">
    PRESCREENING VIDEO · BLOCK 1: WHO [0:00–0:17]
  </text>

  <!-- Spherical Microgravity Flame Visual (Centerpiece) -->
  <g transform="translate(960, 480)">
    <!-- Chamber Rings -->
    <circle r="220" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-dasharray="8 6"/>
    <circle r="190" fill="none" stroke="#64748b" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="160" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Outer Soot / Radiative Boundary -->
    <circle r="150" fill="url(#outerSoot)"/>

    <!-- Core Spherical Diffusion Flame (Buoyancy-Free) -->
    <circle r="105" fill="url(#flameGlow)" filter="url(#glowEffect)"/>
    <circle r="45" fill="#ffffff" opacity="0.9" filter="url(#glowEffect)"/>

    <!-- Reticle Crosshairs -->
    <line x1="-240" y1="0" x2="-180" y2="0" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="180" y1="0" x2="240" y2="0" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="0" y1="-240" x2="0" y2="-180" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="0" y1="180" x2="0" y2="240" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Microgravity Marker Callout -->
    <text x="210" y="-120" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00e5ff" font-weight="bold">g ≈ 10⁻⁴ to 10⁻⁶ m/s²</text>
    <text x="210" y="-100" font-family="'Inter', sans-serif" font-size="13" fill="#8899b8">Zero Natural Buoyancy</text>
    <polyline points="200,-115 160,-80" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Primary Headline -->
  <text x="960" y="780" font-family="'Orbitron', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    FIRE BEHAVES DIFFERENTLY IN MICROGRAVITY.
  </text>
  <text x="960" y="830" font-family="'Inter', sans-serif" font-size="24" fill="#8899b8" text-anchor="middle" letter-spacing="1">
    Without natural buoyancy, flames can spread, extinguish, and produce smoke in ways unknown on Earth.
  </text>

  <!-- NASA Flight Investigation Badges -->
  <g transform="translate(960, 920)">
    <rect x="-560" y="-30" width="1120" height="60" rx="30" fill="#0c1222" stroke="#00e5ff" stroke-opacity="0.3"/>
    <text x="0" y="8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#00e5ff" text-anchor="middle" letter-spacing="6">
      BASS-II  •  FLEX  •  SPICE  •  SAFFIRE  •  SAME
    </text>
  </g>

  <!-- Lower Border Safe Zone Indicator -->
  <rect x="120" y="1020" width="1680" height="2" fill="#00e5ff" opacity="0.3"/>
  <text x="960" y="1048" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="middle">
    DECEMBER 2008 – PRESENT · NASA PHYSICAL SCIENCES INFORMATICS SYSTEM (PSI) EVIDENCE FOUNDATION
  </text>
</svg>
