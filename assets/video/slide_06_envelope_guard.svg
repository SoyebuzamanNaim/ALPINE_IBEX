<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#220a12"/>
      <stop offset="45%" stop-color="#0e0710"/>
      <stop offset="85%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4d4f" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Top Telemetry Header -->
  <text x="120" y="80" font-family="'JetBrains Mono', monospace" font-size="14" fill="#ff4d4f" letter-spacing="4">
    // SAFETY MECHANISM · EXPERIMENTAL ENVELOPE GUARD [2:26–2:35]
  </text>
  <text x="1800" y="80" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b" text-anchor="end">
    NON-NEGOTIABLE ABSTENTION PROTOCOL
  </text>

  <!-- Central Shield & Hexagonal Convex Hull Boundary -->
  <g transform="translate(960, 360)">
    <!-- Outer Hexagonal Pulse Boundary -->
    <polygon points="0,-180 160,-90 160,90 0,180 -160,90 -160,-90" 
             fill="none" stroke="#ff4d4f" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="10 8"/>
    
    <!-- Inner Solid Defense Boundary -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
             fill="url(#shieldGrad)" stroke="#ff4d4f" stroke-width="3" filter="url(#crimsonGlow)"/>

    <!-- Reticle Center -->
    <circle r="40" fill="#060913" stroke="#ff4d4f" stroke-width="2"/>
    <text x="0" y="8" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ff4d4f" text-anchor="middle">!</text>

    <!-- Scan Lines -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#ff4d4f" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#ff4d4f" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Hero Climax Text: Large & Isolated -->
  <g transform="translate(960, 620)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
      FLARE-X KNOWS WHEN NOT TO PREDICT.
    </text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="22" fill="#ff4d4f" letter-spacing="1" text-anchor="middle" font-weight="600">
      We do not trust a machine learning model simply because it returns a number.
    </text>
  </g>

  <!-- 6 Convex Hull Check Indicators Below Headline -->
  <g transform="translate(180, 740)">
    <!-- Check 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899b8">01. MATERIAL</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Fuel In Spaceflight DB</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">✓ NASA Tested</text>
    </g>

    <!-- Check 2 -->
    <g transform="translate(265, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899b8">02. O₂ FRACTION</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Inside Empirical Range</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">✓ 16.0% – 25.0%</text>
    </g>

    <!-- Check 3 -->
    <g transform="translate(530, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899b8">03. PRESSURE</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Chamber Pressure Valid</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">✓ 56 – 101.3 kPa</text>
    </g>

    <!-- Check 4 -->
    <g transform="translate(795, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899b8">04. AIRFLOW</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ventilation Speed Match</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">✓ 0 – 35 cm/s</text>
    </g>

    <!-- Check 5 -->
    <g transform="translate(1060, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899b8">05. GEOMETRY</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Tested Shape Boundary</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">✓ Cylinder / Rod</text>
    </g>

    <!-- Check 6 -->
    <g transform="translate(1325, 0)">
      <rect width="240" height="90" rx="8" fill="#111828" stroke="#ff4d4f" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff4d4f">06. NEIGHBORHOOD</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Local k-NN Density</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d4f">! Boundary Check</text>
    </g>
  </g>

  <!-- Bottom Epistemic Safeguard Statement -->
  <g transform="translate(960, 890)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" fill="#a0aec0" text-anchor="middle">
      When outside tested spaceflight limits, FLARE-X <tspan font-weight="bold" fill="#ff4d4f">withholds the prediction</tspan> and provides the nearest actual NASA flight observations.
    </text>
  </g>

  <!-- Lower Border Safe Zone Indicator -->
  <rect x="120" y="1020" width="1680" height="2" fill="#ff4d4f" opacity="0.3"/>
  <text x="960" y="1048" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="middle">
    ACTIVE SCIENTIFIC REFUSAL FIREWALL · PREVENTING UNVALIDATED EXTRAPOLATION IN SPACECRAFT SAFETY
  </text>
</svg>
