      <text x="140" y="52" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#a855f7" text-anchor="middle">TIER 3 · LLM REASONING</text>

      <text x="30" y="100" font-family="'Orbitron', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
        AI SYNTHESIS
      </text>
      <text x="30" y="125" font-family="'Inter', sans-serif" font-size="13" fill="#8899b8">
        Natural language explanation strictly anchored in Tiers 1 &amp; 2
      </text>

      <line x1="30" y1="145" x2="490" y2="145" stroke="#a855f7" stroke-opacity="0.3"/>

      <!-- Chain of Custody Stack -->
      <g transform="translate(30, 170)">
        <rect width="460" height="65" rx="6" fill="#180e28" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">1. RETRIEVAL-AUGMENTED CONTEXT</text>
        <text x="20" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Anchored exclusively in PSI &amp; NTRS extracts</text>
        
        <rect y="80" width="460" height="65" rx="6" fill="#180e28" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">2. ZERO FREE FORM EXTRAPOLATION</text>
        <text x="20" y="128" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Temperature = 0.0 · Deterministic prompts</text>
        
        <rect y="160" width="460" height="65" rx="6" fill="#180e28" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="20" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">3. UNCERTAINTY DISCLOSURE</text>
        <text x="20" y="208" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Explicit warnings for data sparseness</text>

        <rect y="240" width="460" height="65" rx="6" fill="#180e28" stroke="#52c41a" stroke-opacity="0.5"/>
        <text x="20" y="268" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">4. REPRODUCIBILITY CONTRACT</text>
        <text x="20" y="288" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Audit log captures exact citation hashes</text>
      </g>
    </g>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(960, 840)">
    <rect x="-700" y="0" width="1400" height="70" rx="8" fill="#080e1c" stroke="#00e5ff" stroke-opacity="0.3"/>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      TRUST ARCHITECTURE: A SCIENTIST CAN DRILL DOWN FROM ANY AI PHRASE TO THE EXACT NASA DOI
    </text>
    <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b" text-anchor="middle">
      ELIMINATES "BLACK-BOX" HALLUCINATIONS · EMPIRICAL SCIENTIFIC RIGOR GUARANTEED
    </text>
  </g>

  <!-- Lower Border Safe Zone Indicator -->
  <rect x="120" y="1020" width="1680" height="2" fill="#00e5ff" opacity="0.3"/>
  <text x="960" y="1048" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="middle">
    DATA PROVENANCE &amp; EPISTEMIC TRACEABILITY · NASA SPACE APPS CHALLENGE 2026
  </text>
</svg>
