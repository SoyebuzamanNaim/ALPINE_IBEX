<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0c162e"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="nasaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff7700" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Top Telemetry Header -->
  <text x="120" y="80" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00e5ff" letter-spacing="4">
    // SCIENTIFIC TRUST &amp; AUDITABILITY · PROVENANCE MOMENT [3:30–3:43]
  </text>
  <text x="1800" y="80" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b" text-anchor="end">
    3-TIER EPISTEMIC STRATIFICATION
  </text>

  <!-- Headline -->
  <g transform="translate(960, 150)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      EVERY CONCLUSION CARRIES UNAMBIGUOUS PROVENANCE
    </text>
    <text x="0" y="40" font-family="'Inter', sans-serif" font-size="18" fill="#8899b8" text-anchor="middle">
      FLARE-X strictly isolates empirical observations, statistical model predictions, and AI reasoning.
    </text>
  </g>

  <!-- 3 Side-by-Side Provenance Columns -->
  <g transform="translate(140, 240)">
    <!-- Column 1: NASA Empirical Observation -->
    <g transform="translate(0, 0)">
      <rect width="520" height="540" rx="12" fill="#081022" stroke="#00e5ff" stroke-width="2"/>
      
      <!-- Header Badge -->
      <rect x="30" y="30" width="220" height="32" rx="4" fill="#00e5ff" fill-opacity="0.2"/>
      <text x="140" y="52" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00e5ff" text-anchor="middle">TIER 1 · EMPIRICAL FACT</text>

      <text x="30" y="100" font-family="'Orbitron', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
        NASA FLIGHT OBSERVATION
      </text>
      <text x="30" y="125" font-family="'Inter', sans-serif" font-size="13" fill="#8899b8">
        Direct physical measurements from orbital combustion rigs
      </text>

      <line x1="30" y1="145" x2="490" y2="145" stroke="#00e5ff" stroke-opacity="0.3"/>

      <!-- Chain of Custody Stack -->
      <g transform="translate(30, 170)">
        <rect width="460" height="65" rx="6" fill="#0c1630" stroke="#00e5ff" stroke-opacity="0.3"/>
        <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff">1. NASA EXPERIMENT</text>
        <text x="20" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">BASS-II Flight Test #31</text>
        
        <rect y="80" width="460" height="65" rx="6" fill="#0c1630" stroke="#00e5ff" stroke-opacity="0.3"/>
        <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff">2. SOURCE TELEMETRY</text>
        <text x="20" y="128" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">PSI Dataverse Record ID: 10.25923/9k8a-5632</text>
        
        <rect y="160" width="460" height="65" rx="6" fill="#0c1630" stroke="#00e5ff" stroke-opacity="0.3"/>
        <text x="20" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff">3. INVESTIGATION &amp; HARDWARE</text>
        <text x="20" y="208" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ISS CIR (Combustion Integrated Rack)</text>

        <rect y="240" width="460" height="65" rx="6" fill="#0c1630" stroke="#52c41a" stroke-opacity="0.5"/>
        <text x="20" y="268" font-family="'JetBrains Mono', monospace" font-size="11" fill="#52c41a">4. NASA NTRS CITATION</text>
        <text x="20" y="288" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">NASA/TM-2015-218764 (Peer-Reviewed)</text>
      </g>
    </g>

    <!-- Column 2: Model Inference -->
    <g transform="translate(560, 0)">
      <rect width="520" height="540" rx="12" fill="#081022" stroke="#ffb300" stroke-width="2"/>
      
      <!-- Header Badge -->
      <rect x="30" y="30" width="220" height="32" rx="4" fill="#ffb300" fill-opacity="0.2"/>
      <text x="140" y="52" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#ffb300" text-anchor="middle">TIER 2 · STATISTICAL ML</text>

      <text x="30" y="100" font-family="'Orbitron', sans-serif" font-size="24" font-weight="bold" fill="#ffffff">
        MODEL INFERENCE
      </text>
      <text x="30" y="125" font-family="'Inter', sans-serif" font-size="13" fill="#8899b8">
        Bounded algorithmic estimations with quantified confidence
      </text>

      <line x1="30" y1="145" x2="490" y2="145" stroke="#ffb300" stroke-opacity="0.3"/>

      <!-- Chain of Custody Stack -->
      <g transform="translate(30, 170)">
        <rect width="460" height="65" rx="6" fill="#1c1608" stroke="#ffb300" stroke-opacity="0.3"/>
        <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300">1. MODEL RUN IDENTIFIER</text>
        <text x="20" y="48" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Run #2026-BASS-RG-042</text>
        
        <rect y="80" width="460" height="65" rx="6" fill="#1c1608" stroke="#ffb300" stroke-opacity="0.3"/>
        <text x="20" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300">2. MODEL ARCHITECTURE &amp; VERSION</text>
        <text x="20" y="128" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">LightGBM-v1.4 (Regime Classifier)</text>
        
        <rect y="160" width="460" height="65" rx="6" fill="#1c1608" stroke="#ffb300" stroke-opacity="0.3"/>
        <text x="20" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb300">3. TRAINING EVIDENCE SET</text>
        <text x="20" y="208" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">38 Audited BASS-II Spaceflight Runs</text>

        <rect y="240" width="460" height="65" rx="6" fill="#1c1608" stroke="#ff4d4f" stroke-opacity="0.5"/>
        <text x="20" y="268" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d4f">4. RESIDUAL CONFIDENCE</text>
        <text x="20" y="288" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Bounded strictly by Envelope Guard</text>
      </g>
    </g>

    <!-- Column 3: AI Synthesis -->
    <g transform="translate(1120, 0)">
      <rect width="520" height="540" rx="12" fill="#081022" stroke="#a855f7" stroke-width="2"/>
      
      <!-- Header Badge -->
