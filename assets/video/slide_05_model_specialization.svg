<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgLabGrad)"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Top Telemetry Header -->
  <g transform="translate(120, 75)">
    <rect x="-16" y="-24" width="620" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="0" cy="-3" r="5" fill="#1d4ed8"/>
    <text x="18" y="2" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#1d4ed8" letter-spacing="2">
      QUANTITATIVE ML ARCHITECTURE · BLOCK 3 [1:50–2:05]
    </text>
  </g>
  <g transform="translate(1800, 75)">
    <rect x="-440" y="-24" width="440" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="-20" y="2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5" text-anchor="end">
      FAMILY-SPECIALIZED QUANTITATIVE INFERENCE
    </text>
  </g>

  <!-- Headline -->
  <g transform="translate(960, 150)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="36" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">
      FAMILY-SPECIALIZED QUANTITATIVE MODELS
    </text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#64748b" text-anchor="middle">
      FLARE-X rejects fragile general-purpose LLMs. Each physical combustion regime uses dedicated, physics-bounded models.
    </text>
  </g>

  <!-- 3 Model Cards -->
  <g transform="translate(140, 240)">
    <!-- Card 1: SPICE-FL (Gas) -->
    <g transform="translate(0, 0)">
      <rect width="520" height="560" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="520" height="6" rx="3" fill="#0284c7"/>
      
      <!-- Top Badge -->
      <rect x="30" y="28" width="130" height="28" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="95" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#0284c7" text-anchor="middle">GAS FLAMES</text>
      
      <text x="30" y="94" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#0f172a">SPICE-FL</text>
      <text x="30" y="122" font-family="'Inter', sans-serif" font-size="14.5" fill="#0284c7" font-weight="700">Flame-Length &amp; Radiance Regressor</text>
      <line x1="30" y1="140" x2="490" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="30" y="172" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">FLIGHT DATASET:</text>
      <text x="30" y="196" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">NASA SPICE (Smoke Point in Co-flow)</text>

      <text x="30" y="235" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">PHYSICAL TARGET:</text>
      <text x="30" y="259" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Continuous flame tip position &amp; length (mm)</text>

      <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">INPUT FEATURES:</text>
      <text x="30" y="322" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Fuel injection velocity (cm/s)</text>
      <text x="30" y="344" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Co-flow duct velocity (cm/s)</text>
      <text x="30" y="366" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Ambient O₂ mole fraction (%)</text>
      <text x="30" y="388" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Burner inner diameter (mm)</text>

      <rect x="30" y="445" width="460" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="45" y="475" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#059669" font-weight="800">VALIDATION TARGET:</text>
      <text x="45" y="502" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#14532d">R² ≥ 0.85 on 5-fold spatial cross-validation</text>
    </g>

    <!-- Card 2: FLEX-EX (Droplets) -->
    <g transform="translate(560, 0)">
      <rect width="520" height="560" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="520" height="6" rx="3" fill="#059669"/>
      
      <!-- Top Badge -->
      <rect x="30" y="28" width="150" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="105" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">DROPLET FLAMES</text>
      
      <text x="30" y="94" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#0f172a">FLEX-EX</text>
      <text x="30" y="122" font-family="'Inter', sans-serif" font-size="14.5" fill="#059669" font-weight="700">Droplet Extinction Classifier</text>
      <line x1="30" y1="140" x2="490" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="30" y="172" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">FLIGHT DATASET:</text>
      <text x="30" y="196" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">NASA FLEX (Flame Extinction Experiment)</text>

      <text x="30" y="235" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">PHYSICAL TARGET:</text>
      <text x="30" y="259" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Binary Radiative vs Flame Extinction</text>

      <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">INPUT FEATURES:</text>
      <text x="30" y="322" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Initial droplet diameter (d₀ mm)</text>
      <text x="30" y="344" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Ambient pressure &amp; inert diluent (He/N₂/CO₂)</text>
      <text x="30" y="366" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Fuel type (Decane, Heptane, Methanol)</text>
      <text x="30" y="388" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Ambient oxygen concentration (%)</text>

      <rect x="30" y="445" width="460" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="45" y="475" font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#059669" font-weight="800">VALIDATION TARGET:</text>
      <text x="45" y="502" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#14532d">AUC-ROC ≥ 0.88 with Leave-One-Fuel-Out CV</text>
    </g>

    <!-- Card 3: BASS-GB (Solid Polymers - Flagship) -->
    <g transform="translate(1120, 0)">
      <rect width="520" height="560" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="520" height="8" rx="4" fill="#1d4ed8"/>
      
      <!-- Top Badge -->
      <rect x="30" y="28" width="165" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="112" y="47" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">SOLID POLYMERS ★</text>
      
      <text x="30" y="94" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#0f172a">BASS-GB</text>
      <text x="30" y="122" font-family="'Inter', sans-serif" font-size="14.5" fill="#1d4ed8" font-weight="700">Solid Flame Extinction Classifier</text>
      <line x1="30" y1="140" x2="490" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="30" y="172" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">FLIGHT DATASET:</text>
      <text x="30" y="196" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">NASA BASS-II (145 Verified Spaceflight Burns)</text>

      <text x="30" y="235" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">PHYSICAL TARGET:</text>
      <text x="30" y="259" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0f172a">Quenched vs Sustained Burning Regime</text>

      <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748b">INPUT FEATURES:</text>
      <text x="30" y="322" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Forced ventilation velocity u (0–55 cm/s)</text>
      <text x="30" y="344" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Oxygen concentration (14–22% O₂)</text>
      <text x="30" y="366" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Fuel thickness / geometry (Flat sheet vs Rod)</text>
      <text x="30" y="388" font-family="'Inter', sans-serif" font-size="13" fill="#334155">• Fuel material (PMMA, Cotton, Nomex)</text>

      <rect x="30" y="445" width="460" height="85" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text x="45" y="475" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1d4ed8" font-weight="800">PROVEN BENCHMARK PERFORMANCE:</text>
      <text x="45" y="502" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#0f172a">79.31% Grouped CV Accuracy (+27.6% Lift)</text>
    </g>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(960, 855)">
    <rect x="-650" y="-35" width="1300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan fill="#1d4ed8">SCIENTIFIC INTEGRITY:</tspan> Evaluated with zero-leakage grouped cross-validation across real spaceflight tests.
    </text>
  </g>
</svg>
