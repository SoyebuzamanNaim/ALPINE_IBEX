<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1000" height="560" fill="url(#bgLabGrad)" rx="12"/>
  <rect width="998" height="558" x="1" y="1" fill="none" stroke="#cbd5e1" rx="12"/>

  <!-- Title Banner -->
  <text x="500" y="45" font-family="'Orbitron', sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
    FLARE-X SYSTEM ARCHITECTURE · CLOSED-LOOP AGENTIC PIPELINE
  </text>
  <text x="500" y="70" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    RESEARCH PROTOTYPE · NASA CHALLENGE #08 "FLAME IN FREEFALL"
  </text>

  <!-- Layer 1: Data Ingestion & Storage -->
  <g transform="translate(60, 105)">
    <rect width="260" height="395" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#1d4ed8"/>
    <text x="130" y="32" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">1. PROVENANCE &amp; DATA</text>
    
    <!-- Sub-blocks -->
    <rect x="20" y="55" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="82" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">NASA PSI &amp; NTRS</text>
    <text x="32" y="103" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">23 Audited Investigations</text>

    <rect x="20" y="135" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="162" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">experiments.parquet</text>
    <text x="32" y="183" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">145 Verified Spaceflight Burns</text>

    <rect x="20" y="215" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="242" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">passages_bm25.json</text>
    <text x="32" y="263" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">78 Semantic Flight Passages</text>

    <rect x="20" y="295" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="322" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">knowledge_graph.json</text>
    <text x="32" y="343" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">5 Combustion Physics Regimes</text>
  </g>

  <!-- Layer 2: Hybrid Retrieval & Multi-Agent Orchestrator -->
  <g transform="translate(370, 105)">
    <rect width="260" height="395" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#0284c7"/>
    <text x="130" y="32" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#0284c7" text-anchor="middle">2. AGENTIC RETRIEVAL</text>
    
    <rect x="20" y="55" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="82" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">Family Router Agent</text>
    <text x="32" y="103" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Directs query to physics family</text>

    <rect x="20" y="135" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="162" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">Evidence Scout Agent</text>
    <text x="32" y="183" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">BM25 + Gower similarity search</text>

    <rect x="20" y="215" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="242" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">Evidence Auditor Agent</text>
    <text x="32" y="263" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Cross-checks NASA flight limits</text>

    <rect x="20" y="295" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="322" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">Synthesizer Agent</text>
    <text x="32" y="343" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Epistemic rationale &amp; caveats</text>
  </g>

  <!-- Layer 3: Quantitative Models & Envelope Guard -->
  <g transform="translate(680, 105)">
    <rect width="260" height="395" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="10" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="5" rx="2.5" fill="#059669"/>
    <text x="130" y="32" font-family="'Orbitron', sans-serif" font-size="13" font-weight="900" fill="#059669" text-anchor="middle">3. MODELS &amp; GUARDS</text>
    
    <rect x="20" y="55" width="220" height="65" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="6"/>
    <text x="32" y="82" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#1d4ed8">BASS-GB (Solid)</text>
    <text x="32" y="103" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">79.31% Grouped CV Accuracy</text>

    <rect x="20" y="135" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="162" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">FLEX-EX (Droplet)</text>
    <text x="32" y="183" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Binary Radiative Extinction</text>

    <rect x="20" y="215" width="220" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
    <text x="32" y="242" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#0f172a">SPICE-FL (Gas)</text>
    <text x="32" y="263" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Flame Tip Length Regression</text>

    <rect x="20" y="295" width="220" height="65" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="6"/>
    <text x="32" y="322" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#dc2626">ENVELOPE GUARD 🛡️</text>
    <text x="32" y="343" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#dc2626">Refusal on Extrapolation</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 320 300 L 370 300" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 630 300 L 680 300" stroke="#0284c7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
</svg>
