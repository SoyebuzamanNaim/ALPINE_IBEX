<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgLabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgLabGrad)"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Top Telemetry Header -->
  <g transform="translate(120, 80)">
    <rect x="-16" y="-24" width="620" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="0" cy="-3" r="5" fill="#1d4ed8"/>
    <text x="18" y="2" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#1d4ed8" letter-spacing="2">
      PROBLEM SPACE ANALYSIS · BLOCK 2: WHY [0:38–1:30]
    </text>
  </g>
  <g transform="translate(1800, 80)">
    <rect x="-420" y="-24" width="420" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="-20" y="2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5" text-anchor="end">
      RESEARCH BOTTLENECK · EVIDENCE FRAGMENTATION
    </text>
  </g>

  <!-- Main Headline Banner -->
  <g transform="translate(960, 160)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="30" font-weight="900" fill="#64748b" text-anchor="middle" letter-spacing="3">
      NASA HAS DECADES OF COMBUSTION DATA.
    </text>
    <text x="0" y="44" font-family="'Orbitron', sans-serif" font-size="40" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
      THE CRITICAL PROBLEM: <tspan fill="#dc2626">WHICH EXPERIMENT ACTUALLY APPLIES?</tspan>
    </text>
  </g>

  <!-- Left: The 5 Fragmented Research Silos -->
  <g transform="translate(140, 260)">
    <rect width="780" height="490" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="8" height="490" rx="4" fill="#1d4ed8"/>
    
    <text x="40" y="45" font-family="'Orbitron', sans-serif" font-size="19" font-weight="900" fill="#0f172a">
      5 SILOED NASA EXPERIMENTAL CAMPAIGNS
    </text>
    <text x="40" y="72" font-family="'Inter', sans-serif" font-size="13.5" fill="#64748b">
      Each campaign investigated distinct physical regimes under non-comparable conditions:
    </text>

    <!-- Silo 1: Solid Fuels -->
    <g transform="translate(40, 95)">
      <rect width="700" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="14" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="95" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">SOLID POLYMERS</text>
      <text x="195" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">BASS-II (Flame Spread Over Solids)</text>
      <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">PMMA, Cotton, Nomex</text>
    </g>

    <!-- Silo 2: Droplet Combustion -->
    <g transform="translate(40, 168)">
      <rect width="700" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="14" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="95" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">LIQUID DROPLETS</text>
      <text x="195" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">FLEX (Droplet Extinction)</text>
      <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Decane, Heptane Drops</text>
    </g>

    <!-- Silo 3: Gaseous Jets -->
    <g transform="translate(40, 241)">
      <rect width="700" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="14" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="95" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">GASEOUS JETS</text>
      <text x="195" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">SPICE (Gaseous Jet Diffusion)</text>
      <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Methane, Hydrogen Jets</text>
    </g>

    <!-- Silo 4: Spacecraft Scale -->
    <g transform="translate(40, 314)">
      <rect width="700" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="14" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="95" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">SPACECRAFT FIRES</text>
      <text x="195" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">SAFFIRE (Large Spacecraft Fires)</text>
      <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Cygnus Cargo Capsule</text>
    </g>

    <!-- Silo 5: Smoke Dynamics -->
    <g transform="translate(40, 387)">
      <rect width="700" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="15" y="14" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="95" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">SMOKE DYNAMICS</text>
      <text x="195" y="36" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a">SAME (Smoke Aerosol Detection)</text>
      <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Particulate Transport</text>
    </g>
  </g>

  <!-- Right: Why Generic LLMs & Keyword Search Fail -->
  <g transform="translate(1000, 260)">
    <rect width="780" height="490" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="8" height="490" rx="4" fill="#dc2626"/>

    <text x="40" y="45" font-family="'Orbitron', sans-serif" font-size="19" font-weight="900" fill="#dc2626">
      THE FAILURE OF GENERIC KEYWORD SEARCH &amp; AI
    </text>
    <text x="40" y="72" font-family="'Inter', sans-serif" font-size="13.5" fill="#64748b">
      Matching words in a 300-page PDF does NOT guarantee physical comparability:
    </text>

    <!-- Cross-Out Box 1: Document Search -->
    <g transform="translate(40, 95)">
      <rect width="700" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="25" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#dc2626">
        ❌ GENERIC DOCUMENT / KEYWORD SEARCH:
      </text>
      <text x="25" y="62" font-family="'Inter', sans-serif" font-size="14" fill="#7f1d1d">
        Finds occurrences of "PMMA" and "18% O₂" across disparate geometries and pressures.
      </text>
      <text x="25" y="85" font-family="'Inter', sans-serif" font-size="13" font-style="italic" fill="#991b1b">
        Result: Combines rod fuel regression with sheet extinction. Physical comparability is lost.
      </text>
    </g>

    <!-- Cross-Out Box 2: Generic LLM Chatbots -->
    <g transform="translate(40, 215)">
      <rect width="700" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="25" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#dc2626">
        ❌ GENERIC LLM CHATBOTS:
      </text>
      <text x="25" y="62" font-family="'Inter', sans-serif" font-size="14" fill="#7f1d1d">
        Invent confident numerical flame speeds beyond the empirical NASA flight domain.
      </text>
      <text x="25" y="85" font-family="'Inter', sans-serif" font-size="13" font-style="italic" fill="#991b1b">
        Result: Hallucinates safety metrics. Unacceptable for life-critical spacecraft safety.
      </text>
    </g>

    <!-- Solution Box: Physical Comparability Required -->
    <g transform="translate(40, 335)">
      <rect width="700" height="120" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="25" y="35" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="800" fill="#059669">
        ✓ WHAT COMBUSTION RESEARCHERS ACTUALLY NEED:
      </text>
      <text x="25" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#14532d">
        Multi-dimensional Gower physical similarity across 5 coupled parameters:
      </text>
      <text x="25" y="94" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#047857">
        Fuel Chemistry  •  Sample Geometry  •  O₂ Conc.  •  Forced Flow (u)  •  Pressure
      </text>
    </g>
  </g>

  <!-- Bottom Insight Bar -->
  <g transform="translate(960, 830)">
    <rect x="-650" y="-35" width="1300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="8" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      <tspan fill="#1d4ed8">THE FLARE-X MANDATE:</tspan> Finding a document ≠ Finding a comparable experiment.
    </text>
  </g>
</svg>
